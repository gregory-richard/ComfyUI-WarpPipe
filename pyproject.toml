[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warppipe"
version = "4.0.1"
description = "WarpPipe - bundle a whole generation into one wire, and write prompts with their LoRAs inline"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "gregory-richard"}
]
keywords = ["comfyui", "custom-nodes", "workflow", "data-transfer", "lora", "civitai", "prompt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/gregory-richard/ComfyUI-WarpPipe"
"Homepage" = "https://github.com/gregory-richard/ComfyUI-WarpPipe"
"Bug Reports" = "https://github.com/gregory-richard/ComfyUI-WarpPipe/issues"
"Source" = "https://github.com/gregory-richard/ComfyUI-WarpPipe"

[tool.setuptools]
packages = ["warppipe"]

[tool.setuptools.package-dir]
warppipe = "."

[tool.setuptools.package-data]
# web/*.js is not optional: WEB_DIRECTORY points ComfyUI at ./web, and without
# it an installed wheel has a frontend directory containing only documentation.
# The whole prompt UI, the library browser and the save node's labels are there.
warppipe = ["version.txt", "node_list.json", "web/*.js", "web/docs/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
# Rules are selected explicitly so lint results are a property of this repo
# rather than of whichever ruff release CI happens to install.
#
# Deliberately NOT selected:
#   FA  - would add `from __future__ import annotations`, turning every
#         annotation into a string at runtime. ComfyUI's V3 schema machinery
#         cannot be exercised locally, so the rewrite carries risk it does
#         not repay.
#   N   - naming rules. ComfyUI dictates both the method names (INPUT_TYPES,
#         VALIDATE_INPUTS, IS_CHANGED) and the node-pack directory name, so
#         these findings can never be acted on.
select = ["E4", "E7", "E9", "F", "I", "RUF", "UP"]
ignore = [
    # Node display names intentionally use the spiral emoji and similar
    # characters; ruff reads them as ambiguous unicode.
    "RUF001",
    "RUF003",
]
[tool.comfy]
PublisherId = "gregrichrd"
DisplayName = "WarpPipe Nodes"
Icon = "https://raw.githubusercontent.com/gregory-richard/ComfyUI-WarpPipe/main/assets/registry/icon.png"
Banner = "https://raw.githubusercontent.com/gregory-richard/ComfyUI-WarpPipe/main/assets/registry/banner.png"
