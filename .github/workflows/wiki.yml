name: Publish wiki

# The wiki/ folder in this repo is the source of truth: it reviews with the code
# that changes it. This copies it into the GitHub wiki, which is a separate
# repository, so the pages are also browsable at /wiki with its own navigation.
#
# The wiki repo has to exist before the first run - GitHub only creates it once
# a page has been made in the web UI. Create any page there once and delete it
# afterwards if you like; this replaces the contents wholesale.

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rewrite repo-relative links for the wiki
        # The wiki is a different repository, so ../assets and ../CHANGELOG.md
        # resolve to nothing there. Images become raw URLs and repo links become
        # blob URLs; links between wiki pages are left alone, because GitHub
        # resolves Usage.md to the Usage page on its own.
        run: |
          set -euo pipefail
          mkdir -p build
          cp wiki/*.md build/
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main"
          blob="https://github.com/${GITHUB_REPOSITORY}/blob/main"
          for f in build/*.md; do
            sed -i "s#](\.\./assets/#](${raw}/assets/#g" "$f"
            sed -i "s#](\.\./#](${blob}/#g" "$f"
          done
          echo "--- remaining relative parents (should be none) ---"
          ! grep -rn '](\.\./' build/ || exit 1

      - name: Push to the wiki
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-repo
          # Replace wholesale: a page deleted from wiki/ should disappear.
          find wiki-repo -maxdepth 1 -name '*.md' -delete
          cp build/*.md wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already matches wiki/; nothing to push."
            exit 0
          fi
          git commit -m "Publish wiki from ${GITHUB_SHA::7}"
          git push
