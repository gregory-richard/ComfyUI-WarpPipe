name: Publish to Comfy Registry
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish Custom Node to Registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Need history to compare this commit's version against the previous one.
          fetch-depth: 0

      # The push trigger fires on any change to pyproject.toml, not just a
      # release. Without this gate, editing metadata or tool config re-publishes
      # the current version, which the registry rejects and which turns the run
      # red. Manual runs always publish.
      - name: Check whether the version changed
        id: version
        run: |
          current=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "current=$current" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" != "push" ]; then
            echo "Manual run: publishing $current."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "No usable previous commit: publishing $current."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous=$(git show "$before:pyproject.toml" 2>/dev/null \
                     | grep -m1 '^version = ' | cut -d'"' -f2 || true)
          if [ "$current" = "$previous" ]; then
            echo "Version unchanged at $current: skipping publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version changed ${previous:-none} -> $current: publishing."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Custom Node
        if: steps.version.outputs.changed == 'true'
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
