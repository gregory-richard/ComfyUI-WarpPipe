name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test tools
        # Pinned deliberately: an unpinned tool turns any upstream release into
        # a red build with no code change. Versions must satisfy the oldest
        # entry in the matrix (3.9), not just the newest.
        # Pillow is not a dependency of this pack - it arrives with ComfyUI -
        # but one test writes a real JPEG and reads its EXIF back, which is the
        # only way to check the generation info actually lands where Civitai
        # looks. numpy is deliberately absent: conftest stubs it, so the suite
        # proves it does not need the real one.
        run: python -m pip install "build==1.4.4" "pytest==8.4.2" "ruff==0.16.5" "pillow==11.3.0"
      - name: Lint
        run: python -m ruff check . --exclude .agents --exclude .claude
      - name: Check formatting
        run: python -m ruff format --check . --exclude .agents --exclude .claude
      - name: Run tests
        run: python -m pytest -q
      - name: Build package
        run: python -m build

  web:
    # The frontend is a third of this pack by volume and had no checks at all,
    # which is how two unused arguments and an unescaped innerHTML survived.
    # Its own job, because it shares nothing with the Python matrix.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      # ci, not install: the lockfile is committed so a red build means the
      # code changed, the same reason the Python tools above are pinned.
      - name: Install web tooling
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
