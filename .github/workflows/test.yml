name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test tools
        # Pinned deliberately: an unpinned tool turns any upstream release into
        # a red build with no code change. Bump these as an intentional commit.
        run: python -m pip install "build==1.6.0" "pytest==9.1.1" "ruff==0.16.5"
      - name: Lint
        run: python -m ruff check . --exclude .agents --exclude .claude
      - name: Check formatting
        run: python -m ruff format --check . --exclude .agents --exclude .claude
      - name: Run tests
        run: python -m pytest -q
      - name: Build package
        run: python -m build
