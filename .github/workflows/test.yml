name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test tools
        # ruff is pinned: an unpinned linter turns any upstream release into a
        # red build with no code change. Bump deliberately, not implicitly.
        run: python -m pip install --upgrade build pytest "ruff==0.12.0"
      - name: Lint
        run: python -m ruff check . --exclude .agents --exclude .claude
      - name: Check formatting
        run: python -m ruff format --check . --exclude .agents --exclude .claude
      - name: Run tests
        run: python -m pytest -q
      - name: Build package
        run: python -m build
